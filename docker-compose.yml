version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: scoreflow-backend:latest
    container_name: scoreflow-backend
    volumes:
      # Persist ML model downloads across restarts
      - model_cache:/app/backend/.model_cache
      # Persist uploads and output
      - uploads:/app/backend/uploads
      - output:/app/backend/output
    restart: unless-stopped
    environment:
      - ENV=production
    # CPU-only: no GPU required
    # For GPU support, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: scoreflow-frontend:latest
    container_name: scoreflow-frontend
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: scoreflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  model_cache:
  uploads:
  output:
