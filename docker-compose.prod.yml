# ECS production compose — pulls pre-built images from ACR.
# Static frontend + FastAPI backend + Nginx reverse proxy.
services:
  backend:
    image: crpi-es7e6vutqfirgn70.cn-hangzhou.personal.cr.aliyuncs.com/zky_personal/scoreflow:backend
    container_name: scoreflow-backend
    volumes:
      - model_cache:/app/backend/.model_cache
      - uploads:/app/backend/uploads
      - output:/app/backend/output
      - ./engine:/app/engine:ro
      - ./backend/app:/app/backend/app:ro
    restart: unless-stopped
    environment:
      - ENV=production

  nginx:
    image: crpi-es7e6vutqfirgn70.cn-hangzhou.personal.cr.aliyuncs.com/zky_personal/scoreflow:nginx
    container_name: scoreflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model_cache:
  uploads:
  output:
