# ECS production compose — pulls pre-built images from ACR (Alibaba Cloud Registry).
# No build step on server = no Docker Hub / PyPI access needed.
#
# Usage on ECS:
#   docker compose -f docker-compose.prod.yml up -d
services:
  backend:
    image: crpi-es7e6vutqfirgn70.cn-hangzhou.personal.cr.aliyuncs.com/zky_personal/scoreflow:backend
    container_name: scoreflow-backend
    volumes:
      - model_cache:/app/backend/.model_cache
      - uploads:/app/backend/uploads
      - output:/app/backend/output
    restart: unless-stopped
    environment:
      - ENV=production

  frontend:
    image: crpi-es7e6vutqfirgn70.cn-hangzhou.personal.cr.aliyuncs.com/zky_personal/scoreflow:frontend
    container_name: scoreflow-frontend
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  nginx:
    image: crpi-es7e6vutqfirgn70.cn-hangzhou.personal.cr.aliyuncs.com/zky_personal/scoreflow:nginx
    container_name: scoreflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  model_cache:
  uploads:
  output:
