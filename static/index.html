<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreFlow — AI 跨乐器乐谱转写</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <span class="logo">🎵 ScoreFlow</span>
            <span class="tagline">AI 跨乐器乐谱转写 · Verovio 专业刻谱引擎</span>
        </header>

        <section class="instrument-bar">
            <button class="inst active" data-id="guitar">🎸 吉他</button>
            <button class="inst" data-id="ukulele">🪕 尤克里里</button>
            <button class="inst" data-id="piano">🎹 钢琴</button>
            <button class="inst" data-id="violin">🎻 小提琴</button>
            <button class="inst" data-id="harp">🎼 竖琴</button>
            <button class="inst" data-id="guzheng">🏯 古筝</button>
            <button class="inst" data-id="suona">📯 唢呐</button>
        </section>

        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📂</div>
                <p class="upload-text">拖拽音频到此处，或<span class="link">点击上传</span></p>
                <p class="upload-hint">MP3 / WAV / M4A / FLAC · 最大 50MB</p>
            </div>
            <input type="file" id="fileInput" hidden accept="audio/*">
            <div class="file-info" id="fileInfo" style="display:none">
                <span class="file-icon">🎵</span>
                <span class="file-name" id="fileName"></span>
                <button class="file-remove" id="fileRemove">✕</button>
            </div>
        </section>

        <section class="actions">
            <button class="btn btn-primary" id="transcribeBtn">✨ AI 转写</button>
            <button class="btn btn-secondary" id="convertBtn">🔄 转换乐器</button>
            <button class="btn btn-secondary" id="exportMidiBtn">⬇️ 导出 MIDI</button>
            <button class="btn btn-secondary" id="exportPdfBtn">📄 导出 PDF 乐谱</button>
        </section>

        <div class="demucs-toggle">
            <label class="toggle-label">
                <input type="checkbox" id="demucsToggle">
                <span class="toggle-text">🔇 Demucs 音源分离</span>
                <span class="toggle-hint">去鼓声/人声，提升识别（耗时较长）</span>
            </label>
        </div>

        <div class="progress-bar" id="progressBar" style="display:none">
            <div class="progress-steps">
                <div class="progress-step" id="step1"><span>🔊</span> 分离</div>
                <div class="progress-connector" id="conn1"></div>
                <div class="progress-step" id="step2"><span>🎯</span> 识别</div>
                <div class="progress-connector" id="conn2"></div>
                <div class="progress-step" id="step3"><span>🔄</span> 转换</div>
                <div class="progress-connector" id="conn3"></div>
                <div class="progress-step" id="step4"><span>📜</span> 编排</div>
            </div>
            <div class="progress-label" id="progressLabel">准备中…</div>
        </div>

        <div class="error-box" id="errorBox" style="display:none">
            <span class="error-icon">⚠️</span>
            <span class="error-text" id="errorText"></span>
            <button class="error-close" id="errorClose">✕</button>
        </div>

        <section class="score-section" id="scoreSection" style="display:none">
            <div class="score-header">
                <h3>📜 乐谱</h3>
                <div class="score-controls">
                    <span class="render-badge" id="renderBadge">🎼 Verovio</span>
                    <button class="btn-sm" id="zoomIn">🔍 放大</button>
                    <button class="btn-sm" id="zoomOut">缩小</button>
                    <span class="note-count" id="noteCount"></span>
                </div>
            </div>
            <div class="chord-bar" id="chordBar" style="display:none"></div>
            <div class="score-scroll" id="scoreScroll">
                <div class="score-render" id="notation"></div>
            </div>
        </section>

        <footer class="footer">
            ScoreFlow · 四步管线 · Verovio 专业刻谱引擎 · 7 种乐器支持
        </footer>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
